name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run vocab-lint
      - run: bun run test
      - name: Skill is up to date
        run: |
          bun run build:skill
          git diff --exit-code -- sendgrid-cli/SKILL.md
